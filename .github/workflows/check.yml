name: Windows checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline regression checks (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\Test-Core.ps1
      - name: Render demo controls
        shell: powershell
        run: .\docs\Render-Demo.ps1
